services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8082:80"
    volumes:
      - ./:/var/www/html
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: soleswap
      MYSQL_USER: soleswap_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD""]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    ports:
      - "8083:80"
    environment:
      PMA_HOST: db
    depends_on:
      db:
        condition: service_healthy
volumes:
  mysql_data:
